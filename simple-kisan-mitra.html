<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simple Kisan Mitra</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7ef;color:#213629}.header{background:#245b3b;color:#fff;padding:22px max(18px,calc((100% - 820px)/2))}.header h1{margin:0}.header p{margin:8px 0 0}.wrap{max-width:820px;margin:24px auto;padding:0 16px;display:grid;gap:18px}.card{background:white;border:1px solid #dbe5d7;border-radius:14px;padding:20px}.card h2{margin-top:0}label{display:block;font-weight:bold;margin:12px 0 6px}input,textarea,select{font:inherit;width:100%;padding:12px;border:1px solid #cbd7c7;border-radius:8px}textarea{min-height:90px;resize:vertical}button{background:#245b3b;color:#fff;border:0;border-radius:8px;padding:12px 16px;font-weight:bold;cursor:pointer}.line{display:flex;gap:8px}.line input{flex:1}.result{margin-top:14px;padding:14px;background:#f1f6ed;border-radius:9px;white-space:pre-wrap;line-height:1.55}.chat{display:grid;gap:10px;margin:14px 0}.msg{padding:12px;border-radius:9px;white-space:pre-wrap;line-height:1.5}.user{background:#e1efdf;margin-left:20px}.bot{background:#f1f6ed;margin-right:20px}.hint{color:#667568;font-size:14px}@media(min-width:680px){.wrap{grid-template-columns:1fr 1fr}.chatcard{grid-column:1/-1}}@media(max-width:480px){.line{flex-direction:column}.card{padding:16px}}
</style>
</head>
<body>
<header class="header"><h1>🌾 Simple Kisan Mitra</h1><p>मौसम और खेती से जुड़े सवालों के लिए आसान सहायक</p></header>
<main class="wrap">
<section class="card"><h2>🌦️ मौसम</h2><p class="hint">अपने शहर का नाम डालकर मौसम देखें।</p>
<form id="weatherForm"><label for="city">शहर का नाम</label><div class="line"><input id="city" value="Mathura" required><button id="weatherBtn">मौसम देखें</button></div></form>
<div id="weatherResult" class="result">शहर का नाम डालें और मौसम देखें।</div></section>
<section class="card chatcard"><h2>💬 AI Chat</h2><p class="hint">खेती, बीज, सिंचाई और मिट्टी से जुड़े सवाल पूछें।</p>
<label for="language">भाषा</label><select id="language"><option value="hi">हिंदी</option><option value="en">English</option></select>
<div id="chat" class="chat" aria-live="polite"></div>
<form id="chatForm"><label for="question">अपना सवाल लिखें</label><textarea id="question" maxlength="2000" required placeholder="जैसे गेहूँ में पानी कब देना चाहिए?"></textarea><p style="text-align:right"><button id="sendBtn">सवाल भेजें</button></p></form>
</section></main>
<script>
const $=id=>document.getElementById(id);
$('weatherForm').addEventListener('submit',async e=>{e.preventDefault();let b=$('weatherBtn');b.disabled=true;$('weatherResult').textContent='मौसम लोड हो रहा है…';try{let r=await fetch('/api/weather?city='+encodeURIComponent($('city').value.trim()));let d=await r.json();if(!r.ok)throw Error(d.error||'मौसम नहीं मिला');$('weatherResult').textContent='📍 '+d.location+'\n🌡️ तापमान: '+d.temperature+'°C\n🤗 महसूस होने वाला: '+d.apparentTemperature+'°C\n💧 नमी: '+d.humidity+'%\n🌧️ वर्षा: '+d.precipitation+' mm\n💨 हवा: '+d.windSpeed+' km/h\nसमय: '+d.time}catch(err){$('weatherResult').textContent='समस्या: '+err.message}finally{b.disabled=false}});
function message(t,c){let n=document.createElement('div');n.className='msg '+c;n.textContent=t;$('chat').appendChild(n);return n}
$('chatForm').addEventListener('submit',async e=>{e.preventDefault();let q=$('question').value.trim();if(!q)return;message(q,'user');$('question').value='';let b=$('sendBtn');b.disabled=true;let a=message('जवाब तैयार हो रहा है…','bot');try{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,language:$('language').value})});let d=await r.json();if(!r.ok)throw Error(d.error||'AI जवाब नहीं मिला');a.textContent=d.answer||'जवाब उपलब्ध नहीं है'}catch(err){a.textContent='समस्या: '+err.message}finally{b.disabled=false}});
</script></body></html>
